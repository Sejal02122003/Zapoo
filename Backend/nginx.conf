# APPZETO Standard Nginx Configuration for VPS (Rate Limiting & Proxy SOP)

# Global rate limiting zone (Must be defined inside http block of /etc/nginx/nginx.conf)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name zapoo.co.in www.zapoo.co.in;

    # Performance & Max Upload Size
    client_max_body_size 100M;
    keepalive_timeout 65;

    # GZIP Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    # Static Uploads (/var/storage)
    location /images/ {
        alias /var/storage/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Unrestricted Health Check
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unrestricted Readiness Check
    location /ready {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Express Node.js Backend API
    location /api/ {
        # Optional Nginx level burst protection
        # limit_req zone=api_limit burst=60 nodelay;
        # limit_conn perip 30;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Disable websocket headers for normal API requests
        proxy_set_header Connection "";

        # Real Client IP Forwarding Header Setup (SOP Mandatory)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Response Buffering
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    # Socket.IO WebSocket Server (Excluded from HTTP API rate limiter per SOP Section 11)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        proxy_cache_bypass $http_upgrade;
    }
}
