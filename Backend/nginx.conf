# Nginx configuration for API domain serving VPS storage images directly

server {
    listen 80;
    server_name api.domain.com; # Replace with your actual domain

    # Max body upload size matching backend 5MB limit
    client_max_body_size 10M;

    # Serve VPS image storage directly via Nginx
    location /images/ {
        alias /var/storage/;
        
        # Performance & Cache headers
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        
        # Security headers for static assets
        add_header X-Content-Type-Options "nosniff";
        
        # Try static file, return 404 if missing
        try_files $uri $uri/ =404;
    }

    # Proxy all backend API requests to Express PM2 process
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }
}
